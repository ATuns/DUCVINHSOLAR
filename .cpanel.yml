---
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/mkdir -p $DEPLOYPATH/data
    - /bin/cp -Rf dist/* $DEPLOYPATH
    - /bin/cp -f dist/.htaccess $DEPLOYPATH/.htaccess
    - /bin/chmod 755 $DEPLOYPATH/api.php
    - /bin/chmod 755 $DEPLOYPATH/data
